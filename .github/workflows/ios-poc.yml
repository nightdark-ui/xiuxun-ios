name: Build iOS POC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "--- xcodebuild ---"
          xcodebuild -version || true
          echo "--- swift ---"
          swift --version || true
          echo "--- xcodegen ---"
          which xcodegen || echo "no xcodegen"
          echo "--- pod ---"
          which pod || echo "no pod"

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: Generate project and install pods
        working-directory: POC
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Build (unsigned)
        working-directory: POC
        run: |
          set -o pipefail
          xcodebuild \
            -workspace XiuxunPOC.xcworkspace \
            -scheme XiuxunPOC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      - name: Package IPA
        working-directory: POC
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r XiuxunPOC-unsigned.ipa Payload
          ls -lh XiuxunPOC-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiuxunPOC-unsigned-ipa
          path: POC/XiuxunPOC-unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
