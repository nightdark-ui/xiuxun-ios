name: Build iOS POC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          echo "xcodegen: $(command -v xcodegen || echo none)"
          echo "pod: $(command -v pod || echo none)"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed"
            xcodegen --version
            exit 0
          fi

          echo "trying homebrew"
          brew install xcodegen || true

          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "homebrew did not provide xcodegen, falling back to release binary"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
              -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)
            echo "found binary: $BIN"
            mkdir -p "$HOME/bin"
            cp "$BIN" "$HOME/bin/xcodegen"
            chmod +x "$HOME/bin/xcodegen"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi

          xcodegen --version

      - name: Fetch base model
        run: |
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o POC/Resources/dinov2-base-fp16.onnx \
            https://api.github.com/repos/nightdark-ui/xiuxun-ios/releases/assets/$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/nightdark-ui/xiuxun-ios/releases/tags/models-v1 | python3 -c "import sys,json;print([a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='dinov2-base-fp16.onnx'][0])")
          ls -lh POC/Resources/dinov2-base-fp16.onnx

      - name: Fetch OpenCV framework
        run: |
          if [ ! -d POC/Vendor/opencv2.framework ]; then
            mkdir -p POC/Vendor
            curl -fL --retry 3 -o /tmp/opencv.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-ios-framework.zip
            unzip -q /tmp/opencv.zip -d /tmp/opencv
            cp -R /tmp/opencv/opencv2.framework POC/Vendor/
          fi
          ls -la POC/Vendor

      - name: Generate project
        working-directory: POC
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la
          test -f XiuxunPOC.xcodeproj/project.pbxproj

      - name: Install pods
        working-directory: POC
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            echo "installing cocoapods"
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install --verbose 2>&1 | tee pod-install.log

      - name: Verify workspace and scheme
        working-directory: POC
        run: |
          set -x
          ls -la
          xcodebuild -list -workspace XiuxunPOC.xcworkspace || true
      - name: Build
        working-directory: POC
        run: |
          set -o pipefail
          xcodebuild \
            -workspace XiuxunPOC.xcworkspace \
            -scheme XiuxunPOC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: POC
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          NAME="PicSeek-v1.0.${GITHUB_RUN_NUMBER}-unsigned.ipa"
          zip -r "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PicSeek-v1.0.${{ github.run_number }}-ipa
          path: POC/PicSeek-v1.0.*.ipa
          retention-days: 14

      - name: Dump logs
        if: always()
        run: |
          for f in POC/pod-install.log POC/build.log; do
            if [ -f "$f" ]; then
              echo "::group::$f (last 80 lines)"
              tail -n 80 "$f" || true
              echo "::endgroup::"
            else
              echo "$f not found"
            fi
          done
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest POC/PicSeek-v1.0.*.ipa --title "v1.0.$GITHUB_RUN_NUMBER" --notes "commit $GITHUB_SHA"
          cp POC/PicSeek-v1.0.*.ipa /tmp/PicSeek-latest-unsigned.ipa
          gh release upload latest /tmp/PicSeek-latest-unsigned.ipa --clobber

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            POC/build.log
            POC/pod-install.log
          if-no-files-found: ignore
          retention-days: 7
