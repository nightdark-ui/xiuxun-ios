name: Build iOS POC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          echo "xcodegen: $(command -v xcodegen || echo none)"
          echo "pod: $(command -v pod || echo none)"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed"
            xcodegen --version
            exit 0
          fi

          echo "trying homebrew"
          brew install xcodegen || true

          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "homebrew did not provide xcodegen, falling back to release binary"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
              -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)
            echo "found binary: $BIN"
            mkdir -p "$HOME/bin"
            cp "$BIN" "$HOME/bin/xcodegen"
            chmod +x "$HOME/bin/xcodegen"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi

          xcodegen --version

      - name: Generate project
        working-directory: POC
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la
          test -f XiuxunPOC.xcodeproj/project.pbxproj

      - name: Install pods
        working-directory: POC
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            echo "installing cocoapods"
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install --verbose 2>&1 | tee pod-install.log

      - name: Build
        working-directory: POC
        run: |
          set -o pipefail
          xcodebuild \
            -workspace XiuxunPOC.xcworkspace \
            -scheme XiuxunPOC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: POC
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r XiuxunPOC-unsigned.ipa Payload
          ls -lh XiuxunPOC-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiuxunPOC-unsigned-ipa
          path: POC/XiuxunPOC-unsigned.ipa
          retention-days: 14

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            POC/build.log
            POC/pod-install.log
          if-no-files-found: ignore
          retention-days: 7
