name: Build iOS POC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "::group::System"
          sw_vers
          uname -m
          echo "::endgroup::"
          echo "::group::Xcode"
          (xcodebuild -version || true)
          echo "::endgroup::"
          echo "::group::Tools"
          echo "xcodegen: $(command -v xcodegen || echo none)"
          echo "pod:      $(command -v pod || echo none)"
          echo "ruby:     $(command -v ruby || echo none)"
          echo "::endgroup::"

      - name: Get XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already present"
          else
            echo "downloading xcodegen release binary"
            curl -fL --retry 3 -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            ls -la /tmp/xcodegen
            # release 包解出来通常是 xcodegen/bin/xcodegen 或 .build/release/xcodegen
            BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)
            echo "found: $BIN"
            mkdir -p "$HOME/bin"
            cp "$BIN" "$HOME/bin/xcodegen"
            chmod +x "$HOME/bin/xcodegen"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          xcodegen --version

      - name: Generate project
        working-directory: POC
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la
          test -f XiuxunPOC.xcodeproj/project.pbxproj && echo "project generated OK"

      - name: Install pods
        working-directory: POC
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            echo "installing cocoapods via gem"
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install --repo-update 2>&1 | tee pod-install.log

      - name: Build
        working-directory: POC
        run: |
          set -o pipefail
          xcodebuild \
            -workspace XiuxunPOC.xcworkspace \
            -scheme XiuxunPOC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: POC
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r XiuxunPOC-unsigned.ipa Payload
          ls -lh XiuxunPOC-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiuxunPOC-unsigned-ipa
          path: POC/XiuxunPOC-unsigned.ipa
          retention-days: 14

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            POC/build.log
            POC/pod-install.log
          if-no-files-found: ignore
          retention-days: 7
