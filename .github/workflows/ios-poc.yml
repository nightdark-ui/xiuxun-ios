name: Build iOS POC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 安装工具
        run: |
          brew install xcodegen
          gem install cocoapods --no-document || true

      - name: 生成工程并装依赖
        working-directory: POC
        run: |
          xcodegen generate
          pod install --repo-update

      - name: 编译（不签名）
        working-directory: POC
        run: |
          xcodebuild -workspace XiuxunPOC.xcworkspace \
            -scheme XiuxunPOC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        working-directory: POC
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r XiuxunPOC-unsigned.ipa Payload
          ls -lh XiuxunPOC-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XiuxunPOC-unsigned-ipa
          path: POC/XiuxunPOC-unsigned.ipa
          retention-days: 14
