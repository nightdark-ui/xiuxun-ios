name: XiuxunPOC
options:
  bundleIdPrefix: com.xiuxun
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  XiuxunPOC:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Xiuxun Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiuxun.poc
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_STYLE: Automatic

# CI needs a SHARED scheme, otherwise "xcodebuild -scheme XiuxunPOC" fails
# immediately with exit code 65 ("does not contain a scheme named ...").
schemes:
  XiuxunPOC:
    build:
      targets:
        XiuxunPOC: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug

# Do NOT declare CocoaPods dependencies here: XcodeGen only knows
# target / framework / sdk / package / carthage. The onnxruntime-objc pod
# is declared in Podfile and integrated by "pod install".
