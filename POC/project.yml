name: XiuxunPOC
options:
  bundleIdPrefix: com.xiuxun
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  XiuxunPOC:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PicSeek 搜图
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 需要相机拍摄客户来图进行搜索
        NSPhotoLibraryUsageDescription: 需要访问相册选择客户来图
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: 需要访问局域网，从电脑传输图库包
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiuxun.poc
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BridgingHeader.h
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    dependencies:
      - framework: Vendor/opencv2.framework
        embed: false

# CI needs a SHARED scheme, otherwise "xcodebuild -scheme XiuxunPOC" fails
# immediately with exit code 65 ("does not contain a scheme named ...").
schemes:
  XiuxunPOC:
    build:
      targets:
        XiuxunPOC: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug

# Do NOT declare CocoaPods dependencies here: XcodeGen only knows
# target / framework / sdk / package / carthage. The onnxruntime-objc pod
# is declared in Podfile and integrated by "pod install".
